name: smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-imports:
    name: frontend static imports
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check frontend package declarations
        run: python scripts/dev/check_frontend_imports.py

  # FU-4: openapi-typescript codegen CI check. Regenerates the
  # frontend's api.ts from the backend's OpenAPI schema and fails if
  # the committed file is stale. Per the directive: D3 (PR-time
 # check) without D2 (pre-commit hook). Skipping D2 because the
 # project doesn't yet have enough contributors for local-hook
 # friction to be worth it; the PR-time gate is what matters.
  frontend-types-codegen:
    name: frontend types codegen
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Install the chess-coach Python package in editable mode so
 # `from chess_coach.gateway.app import create_app` resolves in the
 # fresh CI venv.
      - name: Install chess-coach
        run: pip install -e '.[dev]'

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          # Bump from 20 to 22: pnpm 11 requires Node 22.13+ (the
          # CI previously failed with `ERR_UNKNOWN_BUILTIN_MODULE:
          # node:sqlite` on Node 20 + pnpm 11). Node 22 is LTS.
          # Aligned with security-audit.yml which also runs Node 22.
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          # FU-17: align with apps/desktop/package.json's
          # packageManager: pnpm@11 pin. Both CI workflows now
          # resolve to the same pnpm version, so the lockfile
          # generated locally under pnpm 11 matches what CI
          # installs. The dual-location pnpm.overrides block
          # (in this file's apps/desktop/package.json) plus the
          # pnpm-workspace.yaml `overrides:` block (read by pnpm
          # 11+) provide defense-in-depth: js-yaml@4.3.1 is pinned
          # in both locations so the v ulp resolution is robust
          # regardless of which pnpm major version reads the file.
          version: 11

      - name: Install frontend deps (frozen lockfile)
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Verify api.ts matches the backend OpenAPI schema
        run: node scripts/codegen/gen-api.mjs --check

  # FU-25 (2026-08-23): the upstream-inherited apps/desktop/.github/workflows/
  # test.yml (deleted in BBF-103) was the only place frontend lint+test ever
  # ran, and it was never registered with Actions. This job closes that gap
  # now that both commands actually pass locally (vitest e2e exclusion +
  # globalThis fetch mock + oxfmt enforcement landed in BBF-104's follow-up).
  frontend-lint-test:
    name: frontend lint + test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          # FU-17-era pin: pnpm 11 requires Node 22.13+
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install frontend deps (frozen lockfile)
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Lint (tsgo + oxfmt --check + oxlint + i18n key coverage)
        working-directory: apps/desktop
        run: pnpm lint:ci

      - name: Unit/component tests (vitest)
        working-directory: apps/desktop
        run: pnpm test

  # Fast unit-level guard against the BBF-38/40/41/42/44 missing-dep
  # cascade. Runs the gateway boot regression test in a FRESH venv
  # that only has the declared [project.dependencies] installed,
  # so any future runtime dep that gets used by a route module but
  # not declared in pyproject.toml (whether via direct import or via
  # framework-driven implicit use like FastAPI's File/UploadFile
  # requiring python-multipart) will fail here on push instead of
  # taking the smoke workflow red.
  #
  # The smoke job below exercises the full Docker build + gateway
  # start + smoke test. This job is the cheaper, faster signal for
  # the "can the package even import" question.
  gateway-boot:
    name: gateway boot (clean install)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Create fresh venv
        # Fresh venv every run -- never reuse the runner's pre-installed
        # Python site-packages, so a dep that works in a dev's local
        # venv because of an undeclared transitive install cannot
        # sneak past this job.
        run: python -m venv /tmp/boot-venv

      - name: Install package + test deps
        # `pip install -e .[dev]` installs the package AND the
        # declared [project.dependencies] AND the [dev] extras
        # (pytest, pytest-asyncio, etc.) in one step. The install
        # will succeed even if a route module uses an undeclared
        # dep -- that is caught at the import stage in the
        # "Run boot test" step below, which is the actual signal
        # we care about. The fresh venv ensures we are not
        # silently inheriting a transitive install from a previous
        # job on the same runner.
        run: |
          source /tmp/boot-venv/bin/activate
          pip install --upgrade pip --quiet
          pip install -e '.[dev]'

      - name: Run boot test
        # The boot test from BBF-43 plus BBF-52's persistent-path
        # unit test (tests/unit/test_kb_persistent_path.py). The
        # boot test exercises the full import chain; the
        # persistent-path test exercises the QdrantClient(path=...)
        # branch of PositionStore via the qdrant-client library's
        # embedded mode (no live Qdrant needed).
        run: |
          source /tmp/boot-venv/bin/activate
          pytest tests/unit tests/integration \
                 --ignore=tests/integration/test_engine_orch.py \
                 --ignore=tests/integration/test_ocr_backend.py \
                 --ignore=tests/integration/test_pdf_import.py \
                 --ignore=tests/integration/test_probe_with_gold_set.py \
                 --ignore=tests/integration/test_pyinstaller_binary.py


  # BBF-Phase8-1: build the chess-coach-gateway binary via PyInstaller
  # and verify it serves /v1/system/health on a fresh ubuntu-latest
  # runner. The gateway-boot job above exercises the gateway as source;
  # this job exercises the gateway as a frozen --onefile artifact --
  # which catches a different failure mode (PyInstaller static analysis
  # missing a dynamic import, hidden import, or non-Python data file).
  # See docs/16_audit/PHASE-8-MINIMUM-VIABLE-SCOPING-2026-08-20.md for
  # the full Phase 8 scoping brief, and
  # services/chess_coach/gateway/chess-coach-gateway.spec for the spec.
  pyinstaller-binary-smoke:
    name: PyInstaller binary smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Create fresh venv
        # Fresh venv every run, same discipline as gateway-boot above.
        run: python -m venv /tmp/pyinstaller-venv

      - name: Install package + PyInstaller + httpx (test-only)
        # The smoke test imports httpx. PyInstaller is NOT in
        # [project.dependencies] / [project.optional-dependencies.dev]
        # because it's a build-time-only tool, not a runtime dep.
        # Installed fresh here so the build does not inherit any
        # runner-side PyInstaller (different version, different hooks).
        run: |
          source /tmp/pyinstaller-venv/bin/activate
          pip install --upgrade pip --quiet
          pip install -e '.[dev]'
          pip install pyinstaller httpx

      - name: Build binary
        # Run from repo root so the spec's relative `datas` glob
        # (libs/chess_coach/storage/migrations/*.sql) resolves
        # correctly. dist/ and build/ go under /tmp/pyinstaller_dist.
        run: |
          source /tmp/pyinstaller-venv/bin/activate
          pyinstaller --clean --noconfirm \
            --distpath /tmp/pyinstaller_dist/dist \
            --workpath /tmp/pyinstaller_dist/build \
            services/chess_coach/gateway/chess-coach-gateway.spec

      - name: Run binary smoke test
        # tests/integration/test_pyinstaller_binary.py spawns the built
        # binary, polls /v1/system/health until 200, asserts the
        # response shape, and tears down the subprocess.
        run: |
          source /tmp/pyinstaller-venv/bin/activate
          pytest tests/integration/test_pyinstaller_binary.py \
            -v --no-header --tb=short
  # BBF-52: end-to-end exercise of the persistent Qdrant path.
  # Starts a real Qdrant sidecar via `docker run`, runs the gateway
  # pointed at it, and runs the live integration test against
  # /v1/kb/index and /v1/kb/similar.
  #
  # Uses docker run (not services:) per the BBF-33 finding that
  # services: + build: parses to 0 jobs on ubuntu-latest. The
  # qdrant image is prebuilt (no build: needed), so services:
  # would actually work here -- but we keep docker run for symmetry
  # with the smoke job below and to avoid revisiting the BBF-33
  # workaround discussion.
  qdrant-smoke:
    name: qdrant sidecar smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install qdrant-smoke deps
        # The integration test (tests/integration/test_kb_qdrant_live.py)
        # imports pytest, pytest-asyncio, httpx, and the chess_coach
        # package itself. The first three are explicit; the fourth
        # is installed via `pip install -e .` so we get the package
        # in editable mode without dragging in the docker build
        # context (the gateway itself runs in the docker container
        # built by the smoke job, but the test that hits its
        # endpoints runs in the runner's Python env against the
        # gateway's HTTP API -- no need to build the image here).
        run: |
          pip install --upgrade pip --quiet
          pip install -e '.[dev]'
          pip install 'httpx>=0.27'

      - name: Start Qdrant sidecar
        # Pin the version for reproducibility. The image exposes
        # 6333 (HTTP) on the container's loopback; we map it to
        # the runner's 6333 so the integration test can reach it
        # at http://127.0.0.1:6333.
        run: |
          docker run -d \
            --name qdrant-ci \
            -p 6333:6333 \
            -v /tmp/qdrant-storage:/qdrant/storage \
            qdrant/qdrant:v1.12.4

      - name: Wait for Qdrant healthz
        # Qdrant's /healthz endpoint is unauth'd; poll up to 60s.
        run: |
          for i in $(seq 1 60); do
            http_code=$(curl -s -o /tmp/qdrant_health -w "%{http_code}" -m 3 \
              "http://127.0.0.1:6333/healthz" 2>/dev/null || echo "000")
            if [ "$http_code" = "200" ]; then
              echo "qdrant is healthy after ${i}s"
              cat /tmp/qdrant_health
              exit 0
            fi
            if [ $((i % 10)) -eq 0 ] || [ "$i" = "60" ]; then
              echo "[$i/60] http_code=$http_code body=$(cat /tmp/qdrant_health 2>/dev/null | head -c 200)"
            fi
            sleep 1
          done
          echo "qdrant did not become healthy in 60s"
          docker logs qdrant-ci
          exit 1

      - name: Build backend image
        # Build the same image the smoke job builds, with the
        # BBF-52 HEALTHCHECK fix already in. We do NOT use the
        # compose file here -- the qdrant container is already
        # running, and we want the gateway to point at the host
        # port (127.0.0.1:6333) rather than the compose-network
        # hostname `qdrant`.
        run: docker build -t chess-coach-backend:ci -f Dockerfile .

      - name: Start backend (qdrant-aware)
        # CHESS_COACH_QDRANT_URL points the gateway at the
        # sidecar's host port. Without this env var the gateway
        # defaults to ":memory:" and the eager-index branch in
        # app.py:181 is skipped, defeating the test's purpose.
        run: |
          docker run -d \
            --name chess-coach-backend-qci \
            --link qdrant-ci:qdrant \
            -p 18080:18080 \
            -e CHESS_COACH_BACKEND_TOKEN=devtoken123 \
            -e CHESS_COACH_MAX_WORKERS=1 \
            -e CHESS_COACH_QDRANT_URL=http://qdrant:6333 \
            -e CHESS_COACH_QDRANT_API_KEY="" \
            chess-coach-backend:ci

      - name: Wait for backend
        # Same direct-curl pattern as the smoke job below.
        # BBF-38: the Dockerfile's HEALTHCHECK uses Bearer
        # devtoken123 (BBF-52 fix) so `docker inspect` would
        # also work, but we keep the curl loop for symmetry and
        # for the richer failure body.
        run: |
          TOKEN="devtoken123"
          URL="http://127.0.0.1:18080/v1/system/health"
          for i in $(seq 1 120); do
            http_code=$(curl -s -o /tmp/health_body -w "%{http_code}" -m 3 \
              -H "Authorization: Bearer $TOKEN" \
              "$URL" 2>/dev/null || echo "000")
            if [ "$http_code" = "200" ]; then
              body=$(cat /tmp/health_body)
              echo "backend is healthy after $((i * 1))s"
              echo "response: $body"
              exit 0
            fi
            if [ $((i % 10)) -eq 0 ] || [ "$i" = "120" ]; then
              echo "[$i/120] http_code=$http_code body=$(cat /tmp/health_body 2>/dev/null | head -c 200)"
            fi
            sleep 1
          done
          echo "backend did not become healthy in 120s"
          echo "--- last curl response (if any) ---"
          cat /tmp/health_body 2>/dev/null || echo "(no body captured)"
          echo
          echo "--- backend logs ---"
          docker logs chess-coach-backend-qci
          exit 1

      - name: Run qdrant integration test
        # The integration test exercises /v1/kb/index and
        # /v1/kb/similar in-process against the live Qdrant sidecar.
        # It builds a deterministic five-position SQLite fixture,
        # points GatewaySettings.sqlite_path at that fixture, and
        # fails hard on every index error. The test contains no
        # runtime pytest.skip path; any broken prerequisite fails
        # this required integration job.
        env:
          CHESS_COACH_QDRANT_URL: http://127.0.0.1:6333
          CHESS_COACH_BACKEND_TOKEN: devtoken123
        run: |
          pytest tests/integration/test_kb_qdrant_live.py \
            -v --no-header --tb=short

      - name: Backend logs on failure
        if: failure()
        run: |
          echo "=== qdrant logs ==="
          docker logs --tail 80 qdrant-ci 2>&1 || true
          echo "=== backend logs (last 80 lines) ==="
          docker logs --tail 80 chess-coach-backend-qci 2>&1 || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f chess-coach-backend-qci 2>/dev/null || true
          docker rm -f qdrant-ci 2>/dev/null || true

  smoke:
    name: lazy eval-graph smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install smoke test deps
        # The smoke test file (tests/integration/smoke_test.py) is
        # dual-mode: runnable as `python tests/integration/smoke_test.py`
        # (standalone, used in this CI step) OR as
        # `pytest tests/integration/smoke_test.py` (the pytest entry
        # point, used by devs locally). The file does
        # `import pytest` near the bottom for the pytest-mode
        # fixtures; that import is reached even in standalone mode
        # because Python parses the whole file. So we install
        # pytest here alongside httpx.
        run: pip install 'httpx>=0.27' 'pytest>=8.0' 'pytest-asyncio>=0.23'

      - name: Build backend image
        # Build the image as a normal step. We deliberately do NOT
        # use services: with build: here because that triggers a
        # workflow-parse-time failure on the GitHub Actions
        # ubuntu-latest runner (verified empirically 2026-07-14:
        # any workflow with services: + build: parses to 0 jobs
        # and fails before any job runs).
        run: docker build -t chess-coach-backend:ci -f Dockerfile .

      - name: Start backend
        # BBF-52: the curl loop below now uses Bearer devtoken123
        # (was Bearer *** before -- see BBF-38 history). The
        # Dockerfile's HEALTHCHECK was also fixed to use
        # devtoken123 (BBF-52), so this token matches.
        run: |
          docker run -d \
            --name chess-coach-backend-ci \
            -p 18080:18080 \
            -e CHESS_COACH_BACKEND_TOKEN=devtoken123 \
            -e CHESS_COACH_MAX_WORKERS=1 \
            chess-coach-backend:ci

      - name: Wait for backend
        # Poll the backend's /v1/system/health endpoint directly
        # with a curl. We deliberately do NOT use
        # 'docker inspect --format={{.State.Health.Status}}'
        # here because the Dockerfile's HEALTHCHECK hard-codes
        # the bearer token to "***" (a TODO marker that was
        # never replaced with the real value), so the
        # HEALTHCHECK CMD always 401s, the container's health
        # status never becomes "healthy", and the old poll
        # loop timed out at 60s every run -- taking the
        # smoke workflow red since BBF-32.
        #
        # A direct curl against the same endpoint with the
        # real token (matching CHESS_COACH_BACKEND_TOKEN in
        # the Start backend step) gives us an actual 200 vs
        # 401/403/connection-refused signal AND a debuggable
        # response body on failure.
        #
        # BBF-52: the Dockerfile HEALTHCHECK is now fixed
        # (Bearer devtoken123), so docker inspect would work
        # too. We keep the curl loop because it has a richer
        # failure signal (the response body) and works whether
        # or not the HEALTHCHECK is correct.
        run: |
          TOKEN="devtoken123"
          URL="http://127.0.0.1:18080/v1/system/health"
          # The gateway cold-start includes KB pipeline import and
          # SQLite migrations, so allow up to 120s for the first
          # healthy response. After the first green, subsequent
          # restarts are sub-second.
          for i in $(seq 1 120); do
            http_code=$(curl -s -o /tmp/health_body -w "%{http_code}" -m 3 \
              -H "Authorization: Bearer $TOKEN" \
              "$URL" 2>/dev/null || echo "000")
            if [ "$http_code" = "200" ]; then
              body=$(cat /tmp/health_body)
              echo "backend is healthy after $((i * 1))s"
              echo "response: $body"
              exit 0
            fi
            # Log only on the LAST iteration and every 10s to keep
            # the step log readable.
            if [ $((i % 10)) -eq 0 ] || [ "$i" = "120" ]; then
              echo "[$i/120] http_code=$http_code body=$(cat /tmp/health_body 2>/dev/null | head -c 200)"
            fi
            sleep 1
          done
          echo "backend did not become healthy in 120s"
          echo "--- last curl response (if any) ---"
          cat /tmp/health_body 2>/dev/null || echo "(no body captured)"
          echo
          echo "--- backend logs ---"
          docker logs chess-coach-backend-ci
          exit 1

      - name: Run smoke test
        env:
          CHESS_COACH_BASE_URL: http://127.0.0.1:18080
          CHESS_COACH_BACKEND_TOKEN: devtoken123
        run: python tests/integration/smoke_test.py

      - name: Backend logs on failure
        if: failure()
        run: |
          echo "=== backend logs (last 80 lines) ==="
          docker logs --tail 80 chess-coach-backend-ci 2>&1 || true
          echo
          echo "=== docker ps -a ==="
          docker ps -a || true

      - name: Cleanup
        if: always()
        run: docker rm -f chess-coach-backend-ci 2>/dev/null || true  # FU-29-ruff-wire-ci: Stage 3 of the FU-29 ratchet (per
  # docs/16_audit/BBF-FU-29-scoping-brief.md §2, shipped at e2da99c7).
  # Wires `ruff check` to the smoke CI. As of 2026-10-16 (per
  # docs/16_audit/BBF-FU-29-status-check.md, shipped at 8e4e62e3),
  # `ruff check libs services apps/cli tests scripts` returns 0
  # findings (down from 33 pre-burndown, per
  # docs/16_audit/BBF-FU-29-ruff-burndown.md, shipped at a27da3f9).
  # The current `ruff check` IS the ratchet: any new finding
  # flips the gate red, so a future PR that introduces a new
  # E501, F401, I001, etc. will fail this job. The ratchet
  # baseline is 0 findings; new findings are not tolerated.
  #
  # The install step pins `ruff>=0.4` (matching the floor in
  # pyproject.toml [dev] extras). The CI resolves to the latest
  # 0.4.x release at run time, which may surface new rules
  # introduced between the local-dev install and the CI run;
  # this is intentional (the ratchet tightens as ruff evolves).
  ruff:
    name: ruff lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ruff
        # Pin the floor to match pyproject.toml [dev] extras. CI
        # resolves to the latest 0.4.x release; a future bump to
        # 0.5+ in pyproject.toml is a separate decision (tracked
        # in the FU-29-ruff-*-followup chain).
        run: pip install 'ruff>=0.4'

      - name: Run ruff check
        # Match the [tool.ruff] src paths in pyproject.toml:
        # src = ["libs", "services", "apps/cli"]. The tests/ and
        # scripts/ paths are also checked; per
        # [tool.ruff.lint.per-file-ignores] the S (security) and
        # ASYNC rules are silenced for tests/.
        run: ruff check libs services apps/cli tests scripts

  gold-package-artifacts:
    name: gold package clean-install gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run the gold package artifact gate
        # BBF-chess-coach-gold-packaging. This gate is deliberately NOT a
        # checkout-based test: it builds a wheel and an sdist, inspects each
        # archive independently, installs each into its own isolated venv, and
        # probes the imports from a temporary directory OUTSIDE the repository
        # with the checkout and every editable path removed from PYTHONPATH.
        #
        # It fails if either artifact omits chess_coach.gold, leaks unrelated
        # `services/` content, permits the legacy `services.chess_coach.gold`
        # import, or cannot import and exercise chess_coach.gold.eval_delta
        # outside the checkout. A checkout import cannot satisfy it — which is
        # the whole point: the pre-BBF defect was invisible precisely because
        # checkout-based pytest resolved the `services.` path.
        #
        # The gate installs the artifacts with --no-deps and installs the
        # runtime deps the gold import chain actually needs (pydantic) itself;
        # the full dependency tree (torch, sentence-transformers, qdrant) is
        # irrelevant to the PACKAGE SURFACE and would dominate the job's
        # runtime. See scripts/dev/verify_gold_package_artifacts.py.
        run: python scripts/dev/verify_gold_package_artifacts.py --repo-root .

  mypy:
    name: mypy strict
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Sync deps via uv (uses uv.lock for reproducibility)
        # mypy needs the chess_coach package importable so it can
        # resolve cross-package imports (e.g. `from chess_coach.X
        # import Y`). `uv sync --extra dev` installs the package
        # in editable mode AND all dev deps (mypy, ruff, pytest)
        # pinned to the exact versions in uv.lock. This ensures
        # CI uses the same dependency versions that were validated
        # locally, avoiding drift between `pip install` (which
        # resolves to latest compatible) and the lock file.
        # FU-29 Stage 3: after the Stage 1 mypy burn-down
        # (BBF-FU-29-mypy-* chain, culminating in
        # BBF-FU-29-mypy-misc-followup at ed258fdc), mypy is at
        # 0 errors with strict mode enabled, so this gate can
        # fail the build on any new mypy error.
        run: uv sync --extra dev

      - name: Run mypy strict
        # Match the [tool.mypy] config in pyproject.toml:
        # - python_version = "3.11"
        # - strict = true (warn_unused_ignores, disallow_untyped_defs, etc.)
        # - show_error_codes = true
        # - mypy_path = "libs:services:apps/cli"
        # The 4 [tool.mypy.overrides] blocks (chess.*, aiosqlite,
        # keyring, sentence_transformers, sklearn.metrics.pairwise)
        # silence missing-import errors for untyped third-party libs.
        # FU-29-ruff-burndown established ruff at 0 findings; this
        # job establishes mypy at 0 errors as a required CI gate.
        # `uv run` ensures mypy is invoked from the venv created
        # by `uv sync` (avoids exit code 127 = command not found).
        run: uv run mypy libs services apps/cli --no-incremental

  coverage:
    name: pytest-cov baseline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Sync deps via uv (uses uv.lock for reproducibility)
        run: uv sync --extra dev

      - name: Run pytest with coverage
        # FU-29-pytest-cov-baseline: establish the 61% coverage
        # baseline (4785 statements, 1711 missed, 1082 branches,
        # 94 partial). This is the first run; future runs should
        # not regress below this number. The gate is "no regression
        # below baseline" — the ratchet strategy is:
        # Stage 1 (this BBF): establish baseline
        # Stage 2 (future): raise the floor incrementally
        # Stage 3 (future): wire the floor as a CI gate
        #
        # The baseline report is saved to coverage-baseline.txt
        # and committed to the repo (see BBF-FU-29-pytest-cov-baseline.md).
        # Skipping platform-specific tests (keychain, sec01) because
        # they require OS-level dependencies not available in CI.
        run: |
          # FU-29-stage-2-baseline-ratchet: the --cov-fail-under=55
          # flag is the native pytest-cov mechanism for enforcing a
          # coverage floor. This is more robust than a post-test
          # Python assertion because it fails the pytest process
          # itself (exit code 2), which the CI runner treats as a
          # job failure. The 55% floor is 6% below the 61% baseline
          # (see quality-ratchet.json for the ratchet strategy).
          uv run pytest             --cov=libs/chess_coach             --cov=services/chess_coach             --cov=apps/cli/chess_coach             --cov-report=term             --cov-report=xml:coverage.xml             --cov-fail-under=55             --no-header             --tb=no             --ignore=tests/unit/test_keychain.py             --ignore=tests/unit/test_sec01_https_chessvision.py             tests/unit/

      - name: Verify coverage meets baseline
        # The baseline is 61%. This check fails if the current
        # coverage drops below 55% (a 6% regression tolerance
        # for natural variation in which tests are run). The
        # tight tolerance is intentional — we want to catch
        # regressions early, not allow drift.
        run: |
          uv run python -c "
          import coverage
          cov = coverage.Coverage()
          cov.load()
          report = cov.report()
          print(f'Coverage: {report:.1f}%')
          assert report >= 55, f'Coverage {report:.1f}% < baseline floor 55%'
          "

