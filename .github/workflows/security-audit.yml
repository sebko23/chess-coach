name: security-audit

# BBF-sec-05 (S-01.4): security-audit CI workflow.
#
# Audit driver: docs/16_audit/SECURITY-AUDIT-2026-07-30.md §10 Priority 2 #6.
# The audit found that the security-strategy.md §A-F13 documents "CI runs
# pip-audit weekly" but the workflow didn't exist. This workflow adds it.
#
# This workflow runs in addition to the existing smoke.yml. The smoke
# workflow exercises the gateway boot, frontend imports, and end-to-end
# Qdrant path. The security-audit workflow adds the supply-chain and
# disclosure-accuracy checks.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any in-progress run for the same branch/PR. Matches the
# smoke.yml pattern.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: pip-audit. The audit's priority 2 #6 directive explicitly
  # names pip-audit. We run it against uv.lock so the dep graph is
  # reproducible (post-BBF-sec-03). `--strict` makes any unfixed
  # vulnerability a hard failure.
  pip-audit:
    name: pip-audit (Python dep vulnerability scan)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        # Pin the same version as the Dockerfile (BBF-sec-03) so the
        # production install path and the CI path use the same uv.
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.28

      - name: Install pip-audit
        # `uv tool install` puts pip-audit on PATH without polluting
        # the system Python. The audit's priority 2 #6 directive
        # explicitly names pip-audit.
        run: uv tool install --with pip-audit pip-audit

      - name: Build requirements for pip-audit
        # pip-audit's --requirement flag expects pip/requirements.txt
        # format, not uv's TOML lock format. `uv export` converts
        # uv.lock to a requirements file that pip-audit can parse.
        # Critical flags:
        #   --no-hashes: avoid hash mismatch warnings (the hash is in
        #                the lock, not the requirements file).
        #   --no-editable: don't write the editable-marker line.
        #   --no-emit-project: skip the workspace package (chess-coach
        #                     is local-only and not on PyPI; without
        #                     this flag, pip-audit --strict fails with
        #                     "Dependency not found on PyPI").
        #   --frozen: refuse to re-resolve; use the locked deps.
        #   --output-file: the actual flag name (--output is rejected).
        run: uv export --no-hashes --no-editable --no-emit-project --frozen --output-file requirements-ci.txt

      - name: Run pip-audit
        # `--strict` makes any known vulnerability a hard failure.
        # `--requirement requirements-ci.txt` reads the resolved
        # deps from the converted requirements file.
        run: pip-audit --strict --requirement requirements-ci.txt

      - name: Cleanup
        # Don't leave the export file in the working directory.
        if: always()
        run: rm -f requirements-ci.txt

  # Job 2: gitleaks. The audit's priority 2 #6 directive explicitly
  # names gitleaks. The community gitleaks-action scans the full git
  # history and fails on any detected secret.
  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Pull the full history so gitleaks can scan every commit,
          # not just the latest one. fetch-depth=0 is the documented
          # gitleaks-action requirement.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          # Default: scan the full history and fail on any detected
          # secret. GITHUB_TOKEN is required by the action for
          # posting the SARIF results.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 3: uv-lock-check. Post-BBF-sec-03 follow-up. uv.lock is
  # tracked now; this job catches future PRs that modify
  # pyproject.toml without updating uv.lock. `uv lock --check` is
  # silent when the lock is in sync; non-silent when it's stale.
  uv-lock-check:
    name: uv lock --check (lockfile freshness)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.28

      - name: Check uv.lock freshness
        # `uv lock --check` exits 0 (silent) if pyproject.toml and
        # uv.lock are in sync, exits 1 (non-silent) if the lock is
        # stale. Step fails on the non-zero exit; the runner output
        # shows the diff.
        run: uv lock --check

  # Job 4: commit-refs-verify. The leaf reviewer of BBF-sec-04
  # flagged a disclosure-accuracy defect that recurred 5 times in
  # the BBF-sec-04 amend chain. The defect class: a commit body
  # (or PR body) cites file:line references that are stale or
  # point to the wrong section. The reviewer recommended a CI check
  # that parses every file:line reference and verifies the file
  # exists + the line number is within range. This is that check.
  #
  # The check is implemented at scripts/dev/verify_commit_refs.py
  # (added by this BBF). The script is run against the current
  # HEAD's commit body and the PR body (when available).
  commit-refs-verify:
    name: commit ref verify (file:line references)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify commit-body refs
        # Pull the commit body via `git log` and pipe to the script.
        # The script exits 0 if all references are valid, 1 if any
        # are stale. The runner surfaces the stale-reference report.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # On PRs, also verify the PR body (which is the durable
            # record per BBF-sec-04's R5 fix).
            PR_BODY=$(gh pr view "${{ github.event.pull_request.number }}" --json body --jq .body)
            COMMIT_BODY=$(git log -1 --format="%B" HEAD)
            python scripts/dev/verify_commit_refs.py --commit-body "$COMMIT_BODY" --pr-body "$PR_BODY"
          else
            # On push to main, only the commit body is available.
            COMMIT_BODY=$(git log -1 --format="%B" HEAD)
            python scripts/dev/verify_commit_refs.py --commit-body "$COMMIT_BODY"
          fi

  # Job 5: bbf-flip-rules-verify. Enforces the mechanical subset of
  # docs/16_audit/BBF-FLIP-PROCESS-RULES.md: every SHA cited in the
  # commit body or PR body must exist and be an ancestor of the PR base.
  #
  # This is complementary to the commit-refs-verify job above, which
  # validates `file:line` references. The reference gate does NOT check
  # SHAs: a body can name a plausible-looking 7-hex token that was never
  # committed, or one that never landed on main, and the reference gate
  # stays green. That is the gap this job closes.
  #
  # On a PR the base is the PR's base commit and the commit body is read
  # from the PR head (see the env block below for why HEAD is not used).
  # On a push to main the base is HEAD~1 (the parent of the pushed commit).
  bbf-flip-rules-verify:
    name: bbf flip rules verify (SHA ancestry)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify cited SHAs are ancestors of the base
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # On a pull_request event, actions/checkout checks out the
          # synthetic merge commit (refs/pull/N/merge), whose message is
          # "Merge <head-sha> into <base-sha>". `git log -1 HEAD` would
          # therefore yield THAT message, not the PR head's commit body,
          # and the head SHA embedded in it would be checked as a cited
          # SHA against a base it is by definition not an ancestor of.
          # So on a PR we read the head commit's body explicitly.
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_BODY=$(gh pr view "${{ github.event.pull_request.number }}" --json body --jq .body)
            COMMIT_BODY=$(git log -1 --format="%B" "$PR_HEAD_SHA")
            BASE="$PR_BASE_SHA"
            python scripts/dev/verify_bbf_flip_rules.py \
              --repo-root . \
              --base "$BASE" \
              --commit-body "$COMMIT_BODY" \
              --pr-body "$PR_BODY"
          else
            COMMIT_BODY=$(git log -1 --format="%B" HEAD)
            BASE=$(git rev-parse HEAD~1)
            python scripts/dev/verify_bbf_flip_rules.py \
              --repo-root . \
              --base "$BASE" \
              --commit-body "$COMMIT_BODY"
          fi

  # Job 6: pnpm-audit. The audit's priority 3 #7 + the priority-3-doc
  # update note: "`pnpm audit` is NOT yet in CI. A future hardening
  # step would add `pnpm audit --audit-level moderate` to
  # `.github/workflows/security-audit.yml`." This BBF adds the job
  # with `--audit-level moderate` (the priority-3-doc's stated
  # default). The accompanying fix (apps/desktop/package.json
  # + apps/desktop/pnpm-lock.yaml bump deps and overrides to clear
  # all 52 prod-only vulns + the 1 remaining moderate via uuid)
  # ensures the gate passes.
  pnpm-audit:
    name: pnpm audit (JS dep vulnerability scan)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        # Pin pnpm 11 to match the pnpm.overrides resolution that
        # produced the lockfile. pnpm 9 honors the same
        # lockfileVersion: '9.0' but its override semantics may
        # differ from pnpm 11 (this BBF discovered the difference
        # empirically: with pnpm 11 + overrides, all 16 high/critical
        # vulns were cleared; with pnpm 9, the overrides may not
        # propagate to deeply-pinned transitive deps). The action
        # version is @v6 (current stable; v6.0.9 as of 2026-06-15).
        # Note: pnpm 11 requires Node 22.13+; the Setup Node step
        # below pins Node 22 (LTS).
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          # Bump from 20 to 22: pnpm 11 requires Node 22.13+ (the
          # CI previously failed with `ERR_UNKNOWN_BUILTIN_MODULE:
          # node:sqlite` on Node 20 + pnpm 11). Node 22 is LTS.
          node-version: "22"
          # Cache pnpm store keyed to the lockfile. The
          # `cache-dependency-path` is the path relative to the
          # repo root; the action's cache key changes when the
          # lockfile changes.
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Run pnpm audit
        # `--audit-level moderate` is the priority-3-doc's stated
        # default. The locked dep graph now has 0 prod-only
        # vulnerabilities at moderate-or-higher per
        # `pnpm audit --audit-level moderate --prod` (verified
        # locally after the dep upgrades and overrides in
        # apps/desktop/package.json + apps/desktop/pnpm-lock.yaml).
        #
        # `--prod` excludes dev deps from the audit. Dev deps are
        # 0 of the 0 total vulns after the upgrade; they don't ship
        # to users and auditing them would surface noise.
        working-directory: apps/desktop
        run: pnpm audit --audit-level moderate --prod

  # BBF-FU-20-linux-phase1-network-isolation: the A-F11 property-2
  # (no network access) proof. This job runs the PRODUCTION container
  # image with the SHIPPED narrow seccomp profile and the deployment's
  # non-root identity (UID 1000, no host CAP_SYS_ADMIN, not privileged).
  #
  # It runs BOTH an unrestricted control and the launcher-restricted
  # parser against the SAME controlled endpoint. The control MUST
  # connect; if it does not, the job fails and the restricted result
  # proves nothing.
  linux-network-isolation:
    name: linux network isolation (production container)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build the production image
        run: docker build -t chess-coach-backend:fu20 -f Dockerfile .

      - name: Verify the shipped seccomp profile is a narrow delta
        # The profile must differ from the pinned Docker/Moby default
        # ONLY by the narrow namespace/mount/identity ALLOW rules, and
        # the dangerous capability-gated operations (bpf,
        # perf_event_open, fsopen, move_mount) must remain denied to a
        # non-root process. Do not broaden the profile to make a test
        # pass.
        run: |
          python scripts/dev/verify_seccomp_profile.py \
            infra/docker/seccomp-backend.json

      - name: Start the controlled reachable endpoint
        # A real TCP + UDP echo server the restricted and unrestricted
        # processes both target.
        run: |
          docker network create fu20p
          docker run -d --name fu20p-srv --network fu20p \
            -v "$PWD/scripts/dev:/srv:ro" \
            --entrypoint python3 python:3.11-slim-bookworm \
            /srv/fu20_network_endpoint.py \
            --tcp-port 18099 --udp-port 18098
          for _ in $(seq 1 30); do
            if docker logs fu20p-srv 2>&1 | grep -q SERVER_READY; then break; fi
            sleep 1
          done
          docker logs fu20p-srv 2>&1 | head -3

      - name: Verify the AppArmor override is a minimal delta
        # The override must grant exactly the two rules the launcher
        # needs and nothing else: no capability, no deny, no
        # unconfined flag.
        run: |
          python scripts/dev/verify_apparmor_delta.py \
            infra/docker/apparmor-unprivileged-userns-local.override

      - name: Extend the runner's unprivileged_userns AppArmor profile
        # Ubuntu 24.04 restricts unprivileged user namespaces by
        # default. A process that creates a user namespace transitions
        # into AppArmor's `unprivileged_userns` profile, which grants
        # `userns` but NOT `mount` and NOT `x`. The launcher's
        # containment sequence needs both: `mount` to make the root
        # filesystem read-only and bind-mount the artifact path
        # writable, and `x` to exec the parser afterwards.
        #
        # Ubuntu's own profile ends with
        #   include if exists <local/unprivileged_userns>
        # which is the documented site-specific override mechanism. The
        # override below uses it, so the delta against the stock
        # profile is exactly two rules.
        run: |
          sudo mkdir -p /etc/apparmor.d/local
          sudo cp "$PWD/infra/docker/apparmor-unprivileged-userns-local.override" \
            /etc/apparmor.d/local/unprivileged_userns
          sudo apparmor_parser -r /etc/apparmor.d/unprivileged_userns
          echo "--- the override that was installed ---"
          sudo cat /etc/apparmor.d/local/unprivileged_userns
          echo "--- the COMPILED policy: does it grant mount? ---"
          sudo aa-decode < /sys/kernel/security/apparmor/policy/unprivileged_userns \
            2>/dev/null | grep -c "mount" || echo "could not decode"
          echo "--- the override file's presence ---"
          sudo ls -l /etc/apparmor.d/local/unprivileged_userns
          echo "--- the AppArmor DENIED audit log (last 20) ---"
          sudo dmesg 2>/dev/null | grep -i "apparmor.*DENIED" | tail -20 || true
          sudo journalctl -k --no-pager -n 200 2>/dev/null | grep -i "apparmor.*DENIED" | tail -20 || true
          echo "--- the profile the container will actually run under ---"
          docker run --rm --user 1000:1000 --entrypoint sh chess-coach-backend:fu20 \
            -c "cat /proc/self/attr/current" 2>&1 | tail -2

      - name: Probe the mount-propagation strategies
        # The launcher's mount stage must work in the SUPPORTED
        # deployment. The runner and a developer machine differ, so
        # this step measures which strategy the runner actually
        # accepts. It is a diagnostic: it reports, it does not
        # install a fallback.
        run: |
          for s in private slave bind_then_private separate_mountns tmpfs_root remount_ro no_userns no_userns_remount lsm_report cap_status; do
            echo "--- $s ---"
            docker run --rm --user 1000:1000 \
              --security-opt "seccomp=$PWD/infra/docker/seccomp-backend.json" \
              -v "$PWD/scripts/dev:/probe:ro" \
              --entrypoint python3 chess-coach-backend:fu20 \
              /probe/probe_mount_strategies.py "$s" 2>&1 | grep -aE "===|rc=|FAILED|lsm:|before:|apparmor=|BEFORE|AFTER|ns id" || true
          done

      - name: Run the restricted-versus-unrestricted proof
        # The proof container is the PRODUCTION image, running as the
        # deployment's non-root UID 1000, with the SHIPPED seccomp
        # profile. The package comes from the image's editable install,
        # so the import path is the real production one.
        env:
          FU20_ENDPOINT_HOST: fu20p-srv
          FU20_ENDPOINT_PORT: "18099"
        run: |
          docker run --rm --network fu20p --user 1000:1000 \
            --security-opt "seccomp=$PWD/infra/docker/seccomp-backend.json" \
            -v "$PWD/scripts/dev/verify_linux_network_isolation.py:/proof.py:ro" \
            -e FU20_ENDPOINT_HOST -e FU20_ENDPOINT_PORT \
            --entrypoint python3 chess-coach-backend:fu20 \
            /proof.py /tmp/fu20_result.json

      - name: Run the launcher unit tests in the production container
        # The launcher tests that need an unprivileged user namespace
        # only run where the kernel permits one; the production
        # container with the shipped profile is that place.
        run: |
          docker run --rm --user 1000:1000 \
            --security-opt "seccomp=$PWD/infra/docker/seccomp-backend.json" \
            -v "$PWD/tests:/app/tests:ro" \
            -v "$PWD/services:/app/services:ro" \
            -v "$PWD/libs:/app/libs:ro" \
            --entrypoint sh chess-coach-backend:fu20 -c '
              cd /app
              python -m pytest tests/unit/test_linux_sandbox.py -q \
                --no-header -p no:cacheprovider
            '

      - name: Clean up the endpoint and network
        if: always()
        run: |
          docker rm -f fu20p-srv 2>/dev/null || true
          docker network rm fu20p 2>/dev/null || true
