allowBuilds:
  '@swc/core': set this to true or false
  core-js: set this to true or false
onlyBuiltDependencies:
  - "@swc/core"
  - core-js
  - esbuild
  - protobufjs
# FU-14: pnpm v11 reads overrides from pnpm-workspace.yaml, NOT
# from the top-level 'overrides' block in package.json (the latter is
# silently ignored in pnpm v11+; verified empirically by removing the
# package.json override and observing no resolution change).
# FU-12's nanoid/dompurify worked by accident via parent-package
# constraints, not via the package.json override. js-yaml has no
# such parent constraint (exact-pinned by @redocly/openapi-core),
# so the override is load-bearing for js-yaml specifically.
overrides:
  nanoid: "^3.3.17"
  dompurify: "^3.4.13"
  js-yaml: "4.3.1"
