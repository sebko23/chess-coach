# FU-14 + FU-17: pnpm v11 build-approval + overrides
#
# Build approval (allowBuilds)
# ==========================
# pnpm v11 removed `onlyBuiltDependencies`, `neverBuiltDependencies`,
# `ignoredBuiltDependencies`, and `ignoreDepScripts` in favor of a
# single `allowBuilds` map (https://pnpm.io/settings/build#allowbuilds,
# added in v10.26.0). Packages listed with `true` have their build
# scripts run; `false` explicitly disallows; packages not listed are
# disallowed by default (with `strictDepBuilds: true` defaulting on).
# `pnpm approve-builds` writes entries here as well.
#
# The pre-FU-17 file had an unpopulated template for `allowBuilds`
# (`'@swc/core': set this to true or false`) AND a separate
# `onlyBuiltDependencies` list. The template was never populated,
# which is why the original config's build approvals never actually
# approved anything under pnpm 11. The values below were populated
# via `pnpm approve-builds @swc/core core-js` and verified locally.
allowBuilds:
  "@swc/core": true
  core-js: true
  esbuild: true
  protobufjs: true
#
# Overrides (FU-14 + FU-17)
# =========================
# pnpm v11 reads overrides from this file
# (`apps/desktop/pnpm-workspace.yaml`), NOT from the top-level
# 'overrides' block in package.json (the latter is silently ignored
# in pnpm v11+, with `[WARN] The "pnpm" field in package.json is
# no longer read by pnpm`). The top-level `packageManager:
# pnpm@11.21.0` field in apps/desktop/package.json pins the pnpm
# version durably for both local dev (via Corepack) and CI (smoke
# + security-audit workflows are aligned to version: 11). With this
# pin, the legacy `pnpm.overrides` block in package.json is dead
# code and was removed in FU-17.
#
# FU-12's nanoid+dompurify worked by accident via parent-package
# constraints (vite@8.2.1 -> postcss@8.5.26 -> nanoid@^3.3.17;
# posthog-js@1.414.0 -> dompurify@^3.4.13), NOT via any override.
# js-yaml has no such parent constraint (exact-pinned by
# @redocly/openapi-core@1.34.18), so the js-yaml override below is
# load-bearing for the v ulp fix.
overrides:
  nanoid: "^3.3.17"
  dompurify: "^3.4.16" # PR #123 follow-up: bumped from ^3.4.13 to clear GHSA 1240621 + 1241204 (DOMPurify IN_PLACE XSS, low severity, prod-path via posthog-js>dompurify)
  js-yaml: "4.3.1"
  # Phase 8 BBF-2 Round 4 amend: 4 pnpm-workspace.yaml overrides to clear
  # the 4 GHSAs surfaced by the security-audit pnpm-audit job on PR #121
  # head c8826acc (the Round 3 amend of bbf-phase-8-bbf-2-multipart).
  # All 4 targets are transitive deps; all 4 hard-pinning intermediates
  # (via @tanstack/router-core for seroval, postcss for source-map-js,
  # the 4 prosemirror-* packages for prosemirror-view, and the
  # lockfile's frozen 14.3.0 for markdown-it) are bypassed by these
  # overrides, matching the project's existing FU-12 / FU-14 / FU-17 /
  # FU-34 pattern. See PR #123 (the bbf-phase-8-bbf-2-pnpm-dep-bump
  # follow-up) for the full scope and the "2 low" mystery disclosure.
  seroval: "^1.6.3"
  source-map-js: "^1.2.2"
  prosemirror-view: "^1.42.3"
  markdown-it: "^14.3.1"
  # FU-34: GHSA-cp6q-959q-f8rh (Tiptap mergeAttributes() __proto__
  # inheritance). The vulnerable `@tiptap/core@3.29.2` is pulled in
  # transitively by the user-pinned `@tiptap/starter-kit@3.20.0` and
  # `@tiptap/markdown` (resolved to 3.29.2). The 23 transitive
  # `@tiptap/*@3.29.2` packages all fall in the vulnerable range
  # `>=2.0.0-alpha.0 <3.30.4`. The override forces the `@tiptap/core`
  # floor to the patched range; pnpm v11 deduplicates other
  # `@tiptap/*` peer deps against this floor. Pattern matches
  # FU-12 nanoid and FU-14 js-yaml: same-shape dep vulnerability,
  # resolved via pnpm-workspace.yaml overrides (not package.json,
  # which is dead code under pnpm v11+ per FU-17).
  "@tiptap/core": "^3.30.4"
